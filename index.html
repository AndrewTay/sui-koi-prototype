<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163f38">
  <meta name="description" content="MIZU — a collector marketplace for living specimens and works of art">
  <title>MIZU — Living Jewels</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231b3931'/%3E%3Ctext x='24' y='34' text-anchor='middle' font-size='34' fill='%23ece9dc' font-family='Georgia'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="marketplace-dist/marketplace.css">
  <link rel="preload" as="image" href="assets/pond.png" media="(min-width: 761px)">
  <link rel="preload" as="image" href="assets/pond-mobile.png" media="(max-width: 760px)">
  <link rel="preload" as="image" href="assets/kohaku.png">
</head>
<body>
  <a class="skip-link" href="#enter">Skip to browse the collection</a>
  <canvas id="pond" aria-label="A koi swimming in a garden pond" role="img"></canvas>
  <main>
    <section id="home" class="home" aria-label="Mizu koi pond">
      <div class="pond-base" aria-hidden="true"><picture>
        <source media="(max-width: 760px)" srcset="assets/pond-mobile.png">
        <img src="assets/pond.png" alt="" decoding="async" fetchpriority="high">
      </picture></div>
      <img class="fallback-fish" src="assets/kohaku.png" alt="" aria-hidden="true">
      <div class="pond-shade" aria-hidden="true"></div>
      <header class="header hero-header">
        <a class="brand home-link" href="#pond" aria-label="MIZU — return to the pond"><span class="brand-name">mizu</span></a>
      </header>
      <div class="hero-copy">
        <h1>Living<br><em>Jewels</em></h1>
        <p class="hero-description">Lineage, lustre, and living form<br>A private curation of pedigree Japanese nishikigoi</p>
        <button id="enter" class="enter-button"><span>Browse the collection</span></button>
      </div>
      <footer class="hero-footer">
        <div class="experience-controls"><button id="motion-toggle" aria-pressed="true">Motion on</button></div>
      </footer>
      <span id="loading" class="loading-label" role="status">Loading pond</span>
    </section>

    <section id="catalog" class="catalog" aria-labelledby="catalog-title" hidden>
      <div id="marketplace-root"></div>
    </section>
  </main>
  <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>

  <noscript><div class="noscript-note">This interactive pond needs JavaScript. Enable it to swim into the collection.</div></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
